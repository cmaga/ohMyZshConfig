# Standup config.
# Standup is a manual weekday ritual (you invoke `/standup`), so the scheduled
# 12:30 auto-run is disabled; the Friday timesheet-fill job runs it headless to
# backfill unposted days. Where the work is (repos, project, standup files)
# comes from the per-machine ~/.config/harvest/timesheet.toml, through
# timesheet/standup-gather.zsh; repo_path below is only the single-repo fallback.
# Only `cron`, `repo_path`, and `enabled` are read by the deploy script.

enabled = false
cron = "30 12 * * 1-5"
repo_path = "/CHANGEME"
