# Local Anthropic-protocol router (always-on).
# Passes Claude Code's traffic to Anthropic verbatim — response headers
# included, which is what keeps usage limits and low-priority mode working —
# and routes DeepSeek model names to DeepSeek's Anthropic-compatible endpoint.
# Not a scheduled job — a KeepAlive daemon, so it declares `keepalive`
# instead of `cron`.
# Runs as a launchd agent on macOS and a systemd user service on Linux.

enabled = true
keepalive = true
platforms = "macos linux"
