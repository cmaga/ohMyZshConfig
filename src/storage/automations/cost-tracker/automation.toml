# Claude Code cost tracker (always-on).
# Runs a local VictoriaMetrics instance on 127.0.0.1:8428 that every Claude
# Code session pushes OpenTelemetry metrics to (tokens and cost by model,
# agent, effort, skill). The optimize-usage skill queries it when refreshing
# lever costs. Not a scheduled job — a KeepAlive daemon, so it declares
# `keepalive` instead of `cron`.
# macOS only (launchd); the deploy script no-ops on Linux/Windows.
# Only `enabled` and `keepalive` are read by the deploy script.

enabled = true
keepalive = true
