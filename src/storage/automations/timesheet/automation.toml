# Timesheet reconciler: Sunday 11am squares the just-ended Sun-Sat week's
# Harvest hours to the weekly target, on a machine whose per-machine config
# (~/.config/harvest/timesheet.toml, keys in harvest-lib.zsh) sets
# reconcile = true. Without that config the job does nothing: client projects
# and repos live only in that file, never here.
# Only `cron`, `platforms` and `enabled` are read by the deploy script.

enabled = true
platforms = "macos linux"
cron = "0 11 * * 0"
