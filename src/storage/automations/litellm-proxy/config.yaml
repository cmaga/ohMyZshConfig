# claude-* passes through to Anthropic. Claude Code sends its login token in the
# Authorization header, and LiteLLM forwards it only for model groups listed in
# forward_client_headers_to_llm_api — keep deepseek out of that list, or the token
# reaches DeepSeek. deepseek uses the deepseek/ provider on purpose: the
# anthropic/ provider with a custom api_base forwarded the token to DeepSeek.
model_list:
  - model_name: "claude-*"
    litellm_params: {model: "anthropic/claude-*"}
  - model_name: deepseek
    litellm_params:
      model: deepseek/deepseek-flash
      api_base: https://api.deepseek.com
      api_key: os.environ/DEEPSEEK_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  model_group_settings:
    forward_client_headers_to_llm_api: ["claude-*"]
