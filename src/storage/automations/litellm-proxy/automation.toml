# Local LiteLLM proxy (always-on).
# Routes Claude Code's claude-* models to Anthropic and the `deepseek` model name
# to DeepSeek, so worker-agent can run on deepseek while everything else stays on
# Claude. Not a scheduled job — a KeepAlive daemon, so it declares `keepalive`
# instead of `cron`.
# macOS only (launchd); the deploy script no-ops on Linux/Windows.
# Only `enabled` and `keepalive` are read by the deploy script.

enabled = true
keepalive = true
